name: Premium Layout Normalize

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/premium-layout-normalize.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/premium-redesign
          fetch-depth: 0
      - name: Restore and polish layouts
        shell: bash
        run: |
          set -euo pipefail
          git checkout c45e7c0f0b90cbb791fb65fe06f6afda918de98d -- app/src/main/res/layout/activity_shop.xml
          python3 - <<'PY'
          from pathlib import Path
          root = Path('app/src/main/res/layout')
          replacements = {
              'activity_shop.xml': [
                  ('android:background="@android:color/white"', 'android:background="@color/premium_background"'),
                  ('android:paddingTop="10dp"', 'android:paddingTop="12dp"'),
                  ('android:paddingBottom="10dp"', 'android:paddingBottom="12dp"'),
              ],
              'activity_sim.xml': [
                  ('android:background="@android:color/white"', 'android:background="@color/premium_background"'),
              ],
              'activity_primary.xml': [
                  ('android:background="@android:color/white"', 'android:background="@color/premium_background"'),
              ],
              'activity_college.xml': [
                  ('android:background="@android:color/white"', 'android:background="@color/premium_background"'),
              ],
              'activity_bus.xml': [
                  ('android:background="@android:color/white"', 'android:background="@color/premium_background"'),
              ],
          }
          for name, reps in replacements.items():
              p = root / name
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              for a,b in reps:
                  s = s.replace(a,b)
              p.write_text(s, encoding='utf-8')

          p = root / 'activity_upazila_info.xml'
          if p.exists():
              s = p.read_text(encoding='utf-8')
              if 'android:background="@color/premium_background"' not in s.split('>',1)[0]:
                  first = s.split('>',1)[0]
                  if 'android:background=' not in first:
                      first += '\n    android:background="@color/premium_background"'
                  else:
                      import re
                      first = re.sub(r'android:background="[^"]*"', 'android:background="@color/premium_background"', first)
                  s = first + '>' + s.split('>',1)[1]
              s = s.replace('android:textColor="@android:color/black"', 'android:textColor="@color/premium_text"')
              s = s.replace('android:textColor="#000000"', 'android:textColor="@color/premium_text"')
              p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/layout
          git diff --cached --check
          git commit -m "fix: normalize remaining premium layout surfaces" || exit 0
          git push origin HEAD:ui/premium-redesign
