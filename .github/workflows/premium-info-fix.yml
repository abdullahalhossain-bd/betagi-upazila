name: Premium Info Fix
on:
  push:
    paths:
      - '.github/workflows/premium-info-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/premium-redesign
          fetch-depth: 0
      - name: Apply safe root styling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/res/layout/activity_upazila_info.xml')
          s=p.read_text(encoding='utf-8')
          start=s.index('<LinearLayout')
          end=s.index('>', start)
          tag=s[start:end]
          if 'android:background=' not in tag:
              tag += '\n    android:background="@color/premium_background"'
              s=s[:start]+tag+s[end:]
          s=s.replace('android:textColor="@android:color/black"','android:textColor="@color/premium_text"')
          s=s.replace('android:textColor="#000000"','android:textColor="@color/premium_text"')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/res/layout/activity_upazila_info.xml
          git diff --cached --check
          git commit -m 'fix: polish upazila information screen' || exit 0
          git push origin HEAD:ui/premium-redesign
