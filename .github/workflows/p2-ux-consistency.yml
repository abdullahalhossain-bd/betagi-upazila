name: P2 UX consistency audit

on:
  push:
    branches: [ui/premium-redesign]
    paths:
      - 'app/src/main/res/layout/**/*.xml'
      - 'app/src/main/res/drawable/**/*.xml'

permissions:
  contents: write

jobs:
  normalize:
    if: !contains(github.event.head_commit.message, '[skip p2]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/premium-redesign
          fetch-depth: 0

      - name: Normalize user-facing layouts safely
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('app/src/main/res/layout')
          changed = []
          admin_prefixes = ('activity_add_',)

          for p in sorted(root.rglob('*.xml')):
              if p.name in {'activity_add_clinic.xml'} or p.name.startswith(admin_prefixes):
                  continue
              s = p.read_text(encoding='utf-8')
              old = s

              # Repair the known malformed XML prolog without touching layout content.
              s = re.sub(r'^<\?xml version="1\.0" encoding="utf-8"\?\s*\n\s*android:background="([^"]+)"\s*>?',
                         r'<?xml version="1.0" encoding="utf-8"?>\n', s, count=1)
              s = re.sub(r'^<\?xml version="1\.0" encoding="utf-8"\?\s*\n',
                         '<?xml version="1.0" encoding="utf-8"?>\n', s, count=1)

              # Keep the premium system consistent where legacy literals are visibly used.
              s = s.replace('android:background="#FFFFFF"', 'android:background="@color/premium_background"')
              s = s.replace('android:background="#ffffff"', 'android:background="@color/premium_background"')
              s = s.replace('android:background="#000000"', 'android:background="@color/premium_background"')
              s = s.replace('android:textColor="#FFFFFF"', 'android:textColor="@color/white"')
              s = s.replace('android:textColor="#ffffff"', 'android:textColor="@color/white"')
              s = s.replace('android:textColor="#000000"', 'android:textColor="@color/premium_primary"')
              s = s.replace('android:background="@android:color/white"', 'android:background="@color/premium_surface"')

              # Normalize repeated card geometry only; no IDs or behavior are changed.
              s = re.sub(r'(app:cardCornerRadius=")(?:8|10|12|14|16|20|24)dp("\s*/?>)', r'\g<1>18dp\2', s)
              s = re.sub(r'(android:elevation=")(?:1|2|4|5|6|8|10)dp("\s*/?>)', r'\g<1>3dp\2', s)

              # Improve back affordance accessibility while preserving existing IDs/drawables.
              for bid in ('back', 'back_button'):
                  pattern = rf'(<(?:ImageView|ImageButton)[^>]*android:id="@\+id/{bid}"[^>]*)(/?>)'
                  def add_cd(m):
                      block = m.group(1)
                      if 'contentDescription=' in block:
                          return m.group(0)
                      return block + ' android:contentDescription="ফিরে যান"' + m.group(2)
                  s = re.sub(pattern, add_cd, s, count=1)

              if s != old:
                  p.write_text(s, encoding='utf-8')
                  changed.append(str(p))

          print(f'Changed {len(changed)} layout files')
          for x in changed:
              print(x)

      - name: Validate XML
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET
          bad=[]
          for p in Path('app/src/main/res/layout').rglob('*.xml'):
              if p.name.startswith('activity_add_'):
                  continue
              try:
                  ET.parse(p)
              except Exception as e:
                  bad.append(f'{p}: {e}')
          if bad:
              print('\n'.join(bad))
              raise SystemExit(1)
          print('All non-admin layout XML files parse successfully.')

      - name: Commit normalized layouts
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/res/layout
          if git diff --cached --quiet; then
            echo 'No P2 layout changes required.'
            exit 0
          fi
          git commit -m 'feat: apply P2 UX consistency polish [skip p2]'
          git push origin HEAD:ui/premium-redesign
