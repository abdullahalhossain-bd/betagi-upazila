name: P2 UX consistency audit

on:
  push:
    branches: [ui/premium-redesign]
    paths:
      - '.github/workflows/p2-ux-consistency.yml'
      - 'app/src/main/res/layout/activity_madrasa.xml'
      - 'app/src/main/res/layout/activity_primary.xml'
      - 'app/src/main/res/layout/activity_upazila_info.xml'
      - 'app/src/main/res/layout/activity_college.xml'

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, '[skip p2]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/premium-redesign
          fetch-depth: 0

      - name: Normalize requested layouts safely
        shell: python
        run: |
          from pathlib import Path
          import re

          files = [
              Path('app/src/main/res/layout/activity_madrasa.xml'),
              Path('app/src/main/res/layout/activity_primary.xml'),
              Path('app/src/main/res/layout/activity_upazila_info.xml'),
              Path('app/src/main/res/layout/activity_college.xml'),
          ]

          changed = []
          for p in files:
              s = p.read_text(encoding='utf-8')
              old = s
              s = re.sub(r'^<\?xml version="1\.0" encoding="utf-8"\?\s*\n\s*android:background="[^"]+"\s*>?', '<?xml version="1.0" encoding="utf-8"?>\n', s, count=1)
              s = re.sub(r'^<\?xml version="1\.0" encoding="utf-8"\?\s*\n', '<?xml version="1.0" encoding="utf-8"?>\n', s, count=1)
              s = s.replace('android:background="#FFFFFF"', 'android:background="@color/premium_background"')
              s = s.replace('android:background="#ffffff"', 'android:background="@color/premium_background"')
              s = s.replace('android:background="#000000"', 'android:background="@color/premium_background"')
              s = s.replace('android:textColor="#FFFFFF"', 'android:textColor="@color/white"')
              s = s.replace('android:textColor="#ffffff"', 'android:textColor="@color/white"')
              s = s.replace('android:textColor="#000000"', 'android:textColor="@color/premium_primary"')
              s = s.replace('android:background="@android:color/white"', 'android:background="@color/premium_surface"')
              s = re.sub(r'(app:cardCornerRadius=")(?:8|10|12|14|16|20|24)dp("\s*/?>)', r'\g<1>18dp\2', s)
              s = re.sub(r'(android:elevation=")(?:1|2|4|5|6|8|10)dp("\s*/?>)', r'\g<1>3dp\2', s)
              for bid in ('back', 'back_button'):
                  pattern = rf'(<(?:ImageView|ImageButton)[^>]*android:id="@\+id/{bid}"[^>]*)(/?>)'
                  def add_cd(m):
                      block = m.group(1)
                      if 'contentDescription=' in block:
                          return m.group(0)
                      return block + ' android:contentDescription="ফিরে যান"' + m.group(2)
                  s = re.sub(pattern, add_cd, s, count=1)
              if s != old:
                  p.write_text(s, encoding='utf-8')
                  changed.append(str(p))

          print(f'Changed {len(changed)} requested layouts')
          for x in changed:
              print(x)

      - name: Validate requested XML
        shell: python
        run: |
          import xml.etree.ElementTree as ET
          from pathlib import Path
          files = [Path('app/src/main/res/layout/activity_madrasa.xml'), Path('app/src/main/res/layout/activity_primary.xml'), Path('app/src/main/res/layout/activity_upazila_info.xml'), Path('app/src/main/res/layout/activity_college.xml')]
          for p in files:
              ET.parse(p)
              print(f'OK: {p}')

      - name: Commit normalized layouts
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/res/layout/activity_madrasa.xml app/src/main/res/layout/activity_primary.xml app/src/main/res/layout/activity_upazila_info.xml app/src/main/res/layout/activity_college.xml
          if git diff --cached --quiet; then
            echo 'No requested P2 layout changes required.'
            exit 0
          fi
          git commit -m 'feat: polish requested P2 education layouts [skip p2]'
          git push origin HEAD:ui/premium-redesign
