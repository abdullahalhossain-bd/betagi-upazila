name: Premium Layout Batch

on:
  push:
    paths:
      - '.github/workflows/premium-layout-batch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  premium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/premium-redesign
          fetch-depth: 0

      - name: Normalize remaining user-facing layouts
        shell: bash
        run: |
          set -euo pipefail
          L=app/src/main/res/layout
          # Restore the previously damaged long layout from the known-good parent.
          git checkout c45e7c0f0b90cbb791fb65fe06f6afda918de98d -- "$L/activity_shop.xml"

          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('app/src/main/res/layout')
          skip={'activity_add_clinic.xml','activity_add_notice.xml','activity_add_unified_business_item.xml','activity_add_unified_govt_item.xml','activity_add_unified_govt_officer.xml','activity_add_unified_person.xml','activity_add_unified_specialist_doctor.xml'}
          files=[]
          for p in root.glob('*.xml'):
              if p.name in skip: continue
              s=p.read_text(encoding='utf-8')
              if '<' not in s: continue
              files.append(p)
              # Keep all existing content/IDs; only normalize safe visual attributes.
              first=s.find('>')
              if first>=0:
                  head=s[:first]
                  if 'android:background="@android:color/white"' in head:
                      head=head.replace('android:background="@android:color/white"','android:background="@color/premium_background"')
                  elif 'android:background="@color/white"' in head:
                      head=head.replace('android:background="@color/white"','android:background="@color/premium_background"')
                  elif 'android:background=' not in head and p.name in {'activity_upazila_info.xml','activity_bus.xml','activity_sim.xml','activity_shop.xml','activity_high.xml','activity_madrasa.xml','activity_primary.xml','activity_college.xml'}:
                      head += '\n    android:background="@color/premium_background"'
                  s=head+s[first:]
              s=s.replace('android:textColor="@android:color/black"','android:textColor="@color/premium_text"')
              s=s.replace('android:textColor="#000000"','android:textColor="@color/premium_text"')
              s=s.replace('android:background="@android:color/white"','android:background="@color/premium_background"')
              # Legacy white Material cards become the shared premium surface.
              s=s.replace('android:backgroundTint="@color/white"','android:backgroundTint="@color/premium_surface"')
              s=s.replace('app:cardBackgroundColor="@android:color/white"','app:cardBackgroundColor="@color/premium_surface"')
              p.write_text(s,encoding='utf-8')

          # Fix the XML declaration/root styling of Upazila Info safely after restoring content.
          p=root/'activity_upazila_info.xml'
          s=p.read_text(encoding='utf-8')
          s=s.replace('<?xml version="1.0" encoding="utf-8"?>\n<LinearLayout','<?xml version="1.0" encoding="utf-8"?>\n<LinearLayout',1)
          m=re.search(r'<LinearLayout([^>]*)>',s,re.S)
          if m and 'android:background=' not in m.group(1):
              s=s[:m.start(1)]+m.group(1)+'\n    android:background="@color/premium_background"'+s[m.end(1):]
          p.write_text(s,encoding='utf-8')
          PY

          # Remove this self-running workflow after it performs the one-time normalization.
          rm -f .github/workflows/premium-layout-batch.yml
          git add app/src/main/res/layout .github/workflows/premium-layout-batch.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: finish premium UI normalization across user screens'
          git push origin HEAD:ui/premium-redesign
